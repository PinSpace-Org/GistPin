name: Terraform Dry-Run

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'

jobs:
  dry-run:
    name: Terraform Plan (Dry-Run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DRY_RUN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
        continue-on-error: true

      - name: Run dry-run
        run: |
          chmod +x infrastructure/scripts/dry-run-apply.sh
          infrastructure/scripts/dry-run-apply.sh --dir infrastructure/terraform/dry-run --cleanup
        env:
          TF_WORKSPACE: dry-run-${{ github.run_id }}

      - name: Post plan summary to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Terraform dry-run completed. No resources were created. See workflow logs for plan output and cost estimate.'
            })
