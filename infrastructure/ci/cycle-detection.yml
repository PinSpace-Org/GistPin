name: Terraform Graph Cycle Detection

on:
  push:
    paths:
      - 'infrastructure/terraform/**'
      - 'infrastructure/scripts/detect-cycles.py'
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - 'infrastructure/scripts/detect-cycles.py'

jobs:
  detect-cycles:
    name: Detect Terraform Dependency Cycles
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.0'

      - name: Configure AWS credentials (read-only for graph)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Run cycle detection
        run: |
          echo "Generating Terraform dependency graph..."
          terraform graph | python ../../scripts/detect-cycles.py

      - name: Upload graph artifact on failure
        if: failure()
        run: terraform graph > /tmp/terraform-graph.dot

      - name: Upload DOT graph
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dependency-graph
          path: /tmp/terraform-graph.dot
          retention-days: 7
