name: Build Golden AMI
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-packer@main
      - run: packer init infrastructure/packer/ubuntu-base.pkr.hcl
      - run: packer build infrastructure/packer/ubuntu-base.pkr.hcl
