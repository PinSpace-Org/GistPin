# GitHub Actions Workflow — Terraform Plan Secret Scanner (#1133)
# Runs terraform plan and scans the output for known secret patterns.
# Fails the pipeline if any secrets are detected in plan output.

name: Terraform Plan Secret Scan

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
      - "infrastructure/ci/secret-scan-plans.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "infrastructure/terraform/**"
  workflow_dispatch:

env:
  TF_DIR: infrastructure/terraform
  TF_VERSION: "1.9.0"

jobs:
  terraform-plan-scan:
    name: Terraform Plan & Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan (save output)
        id: tf-plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -out=tfplan.binary \
            2>&1 | tee /tmp/terraform-plan-output.txt
          terraform show -no-color tfplan.binary >> /tmp/terraform-plan-output.txt
          echo "plan_exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Scan plan output for secret patterns
        id: secret-scan
        run: |
          echo "Scanning terraform plan output for sensitive patterns..."
          PLAN_FILE="/tmp/terraform-plan-output.txt"
          FOUND_SECRETS=0
          FINDINGS=""

          # Define secret patterns to detect
          declare -A PATTERNS=(
            ["AWS Secret Key"]="AKIA[0-9A-Z]{16}|(?i)aws_secret_access_key\s*=\s*['\"][^'\"]{20,}['\"]"
            ["Private Key Block"]="-----BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY"
            ["Stellar Secret Seed"]="S[A-Z2-7]{55}"
            ["JWT Secret plaintext"]="(?i)jwt_secret\s*=\s*['\"][^'\"]{8,}['\"]"
            ["Database Password"]="(?i)(db_password|database_password)\s*=\s*['\"][^'\"]{4,}['\"]"
            ["API Key plaintext"]="(?i)api_key\s*=\s*['\"][^'\"]{8,}['\"]"
            ["Generic password"]="(?i)password\s*=\s*['\"][^'\"]{8,}['\"]"
            ["Generic secret"]="(?i)secret\s*=\s*['\"][^'\"]{8,}['\"]"
          )

          for LABEL in "${!PATTERNS[@]}"; do
            PATTERN="${PATTERNS[$LABEL]}"
            if grep -qPi "${PATTERN}" "${PLAN_FILE}" 2>/dev/null; then
              echo "::error::SECRET DETECTED: ${LABEL}"
              FINDINGS="${FINDINGS}\n- ⚠️  **${LABEL}** pattern matched in plan output"
              FOUND_SECRETS=1
            else
              echo "  ✅ No match for: ${LABEL}"
            fi
          done

          # Also check for any value not masked as "(sensitive value)"
          SENSITIVE_OUTPUTS=$(grep -c '"sensitive": true' "${PLAN_FILE}" 2>/dev/null || echo "0")
          echo "Sensitive outputs in plan: ${SENSITIVE_OUTPUTS}"

          if [[ "${FOUND_SECRETS}" -eq 1 ]]; then
            echo "found_secrets=true" >> "$GITHUB_OUTPUT"
            echo -e "${FINDINGS}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found_secrets=false" >> "$GITHUB_OUTPUT"
          fi

          echo "scan_complete=true" >> "$GITHUB_OUTPUT"

      - name: Post scan summary
        if: always()
        run: |
          echo "## 🔍 Terraform Plan Secret Scan Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.secret-scan.outputs.found_secrets }}" == "true" ]]; then
            echo "### ❌ FAILED — Secrets detected in plan output" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Secrets were found in the Terraform plan output. Review the findings above and ensure:" >> "$GITHUB_STEP_SUMMARY"
            echo "- All sensitive variables are declared with \`sensitive = true\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- All sensitive outputs are declared with \`sensitive = true\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- No hardcoded secret values exist in \`.tf\` files" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ PASSED — No secrets detected in plan output" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "All sensitive values appear to be properly masked." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if secrets detected
        if: steps.secret-scan.outputs.found_secrets == 'true'
        run: |
          echo "::error::Pipeline failed: Secret patterns detected in Terraform plan output."
          echo "All sensitive values must use sensitive=true in variable and output declarations."
          exit 1

      - name: Clean up plan files
        if: always()
        working-directory: ${{ env.TF_DIR }}
        run: |
          rm -f tfplan.binary
          rm -f /tmp/terraform-plan-output.txt
