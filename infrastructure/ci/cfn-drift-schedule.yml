name: CloudFormation Drift Detection

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      stack_pattern:
        description: 'CloudFormation stack name pattern'
        required: false
        default: 'gistpin-*'
      auto_remediate:
        description: 'Enable auto-remediation'
        required: false
        default: 'false'
        type: boolean

env:
  AWS_REGION: us-east-1
  STACK_PATTERN: ${{ github.event.inputs.stack_pattern || 'gistpin-*' }}

jobs:
  drift-detection:
    name: Detect CloudFormation Drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install AWS CLI
        run: |
          pip install --upgrade awscli

      - name: Detect Drift
        id: drift
        run: |
          chmod +x infrastructure/scripts/cfn-drift-check.sh
          ./infrastructure/scripts/cfn-drift-check.sh \
            --pattern "${{ env.STACK_PATTERN }}" \
            --region "${{ env.AWS_REGION }}" \
            --report-dir "reports" \
          || echo "drift_detected=true" >> "$GITHUB_OUTPUT"

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfn-drift-report-${{ github.run_id }}
          path: reports/cfn-drift-*.json
          retention-days: 30

      - name: Create Issue on Drift
        if: steps.drift.outputs.drift_detected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportFiles = fs.readdirSync('reports').filter(f => f.startsWith('cfn-drift-') && f.endsWith('.json'));
            if (reportFiles.length === 0) return;

            const report = JSON.parse(fs.readFileSync(`reports/${reportFiles[0]}`, 'utf8'));
            const driftedStacks = report.stacks.filter(s => s.drifted_resources.length > 0);

            if (driftedStacks.length === 0) return;

            let body = `## CloudFormation Drift Detected\n\n`;
            body += `**Detection Time:** ${report.timestamp}\n`;
            body += `**Region:** ${report.region}\n\n`;
            body += `### Drifted Stacks\n\n`;

            for (const stack of driftedStacks) {
              body += `#### ${stack.stack}\n\n`;
              body += `| Resource | Type | Status |\n`;
              body += `|----------|------|--------|\n`;
              for (const r of stack.drifted_resources) {
                body += `| ${r.Resource} | ${r.Type} | ${r.Status} |\n`;
              }
              body += `\n`;
            }

            body += `### Remediation\n\n`;
            body += `1. Review the drift report artifact\n`;
            body += `2. Determine if drift is intentional or requires correction\n`;
            body += `3. Apply corrective changes via Terraform or manual updates\n`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Drift] CloudFormation drift detected in ${driftedStacks.length} stack(s)`,
              body: body,
              labels: ['drift', 'infrastructure', 'priority:high']
            });
