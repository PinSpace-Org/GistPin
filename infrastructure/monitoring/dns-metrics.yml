scrape_configs:
  - job_name: node-local-dns
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: node-local-dns
        action: keep
      - source_labels: [__address__]
        regex: (.*):9253
        action: keep
    metrics_path: /metrics
