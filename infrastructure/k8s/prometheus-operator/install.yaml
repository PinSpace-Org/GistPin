apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app: prometheus-operator
---
# Install Prometheus Operator via Helm
# Run: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#      helm upgrade --install prometheus-operator prometheus-community/kube-prometheus-stack \
#        -n monitoring -f infrastructure/k8s/prometheus-operator/values.yaml
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: ">=57.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  values:
    prometheus:
      prometheusSpec:
        retention: 15d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: gp3
              resources:
                requests:
                  storage: 50Gi
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: gp3
              resources:
                requests:
                  storage: 5Gi
    grafana:
      adminPassword: ""   # set via secret
      persistence:
        enabled: true
        size: 10Gi
