---
# HorizontalPodAutoscaler with downscale protection for a critical service.
# Uses the v2 autoscaling API `behavior` block to make scale-DOWN slow and
# deliberate while keeping scale-UP fast — so a service recovering from a
# traffic spike isn't prematurely shrunk back into another overload.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/managed-by: gistpin-infra
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      # React quickly to load: no stabilization delay, allow doubling.
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      # Downscale protection: wait 10 minutes of sustained low load before
      # scaling down, then remove at most 10% of pods per 5 minutes. This
      # prevents thrashing and premature shrink during spike recovery.
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          value: 10
          periodSeconds: 300
      selectPolicy: Min
