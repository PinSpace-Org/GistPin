apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-metrics-adapter-config
  namespace: gistpin-prod
data:
  config.yaml: |
    rules:
      - seriesQuery: '{__name__=~"http_requests_total.*",namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "http_requests_total(.*)"
          as: "http_requests_${1}"
        metricsQuery: |
          sum(rate(<<.Series>>{<<.LabelMatchers>>}[2m])) by (<<.GroupBy>>)

      - seriesQuery: '{__name__=~"gistpin_.*",namespace!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "gistpin_(.*)"
          as: "${1}"
        metricsQuery: |
          sum(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)

      - seriesQuery: '{__name__=~"grpc_server_handled_total.*",namespace!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "grpc_server_handled_total(.*)"
          as: "grpc_requests_${1}"
        metricsQuery: |
          sum(rate(<<.Series>>{<<.LabelMatchers>>}[1m])) by (<<.GroupBy>>)

      - seriesQuery: '{__name__=~"queue_(.*)",namespace!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
        name:
          matches: "queue_(.*)"
          as: "${1}"
        metricsQuery: |
          sum(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)

      - seriesQuery: '{__name__=~"cache_(.*)",namespace!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "cache_(.*)"
          as: "${1}"
        metricsQuery: |
          sum(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)

    resourceRules:
      cpu:
        containerQuery: |
          sum(rate(container_cpu_usage_seconds_total{<<.LabelMatchers>>,container!=""}[3m])) by (<<.GroupBy>>)
        nodeQuery: |
          sum(rate(container_cpu_usage_seconds_total{<<.LabelMatchers>>,instance!=""}[3m])) by (<<.GroupBy>>)
        resources:
          overrides:
            instance: {resource: "node"}
            namespace: {resource: "namespace"}
            container: {resource: "container"}
      memory:
        containerQuery: |
          sum(container_memory_working_set_bytes{<<.LabelMatchers>>,container!=""}) by (<<.GroupBy>>)
        nodeQuery: |
          sum(container_memory_working_set_bytes{<<.LabelMatchers>>,instance!=""}) by (<<.GroupBy>>)
        resources:
          overrides:
            instance: {resource: "node"}
            namespace: {resource: "namespace"}
            container: {resource: "container"}
