---
# SecretProviderClass for AWS Secrets Manager.
# Injects secrets from AWS Secrets Manager directly into pod filesystems via the
# Secrets Store CSI Driver, and syncs them to native Kubernetes Secrets for
# workloads that consume secrets as env vars.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gistpin-aws-secrets
  namespace: backend
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "gistpin/prod/db-credentials"
        objectType: "secretsmanager"
        # Extract individual JSON keys from the secret into separate files.
        jmesPath:
          - path: "username"
            objectAlias: "db-username"
          - path: "password"
            objectAlias: "db-password"
      - objectName: "gistpin/prod/api-key"
        objectType: "secretsmanager"
      - objectName: "gistpin/prod/jwt-secret"
        objectType: "secretsmanager"
  # Sync mounted secrets to Kubernetes Secrets so they can also be consumed as
  # environment variables (secretObjects requires syncSecretEnabled on the driver,
  # already set in install.yaml).
  secretObjects:
    - secretName: gistpin-db-credentials
      type: Opaque
      data:
        - objectName: "db-username"
          key: "username"
        - objectName: "db-password"
          key: "password"
    - secretName: gistpin-api-key
      type: Opaque
      data:
        - objectName: "gistpin/prod/api-key"
          key: "api-key"
---
# Example workload mounting the AWS secrets. Rotation is handled by the driver's
# enableSecretRotation/rotationPollInterval (install.yaml): when the underlying
# Secrets Manager value changes, the mounted files and synced Secret are updated
# within the poll interval.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: gistpin-aws-secrets
      containers:
        - name: backend
          image: ghcr.io/pinspace-org/backend:latest
          # Consume the synced Secret as env vars...
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gistpin-db-credentials
                  key: password
          # ...and/or read the mounted files directly.
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: gistpin-aws-secrets
