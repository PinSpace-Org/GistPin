apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gistpin-vault-secrets
spec:
  provider: vault
  parameters:
    roleName: "gistpin-app"
    vaultAddress: "https://vault.gistpin.io:8200"
    objects: |
      - objectName: "db-password"
        secretPath: "secret/data/gistpin/database"
        secretKey: "password"
      - objectName: "api-key"
        secretPath: "secret/data/gistpin/api"
        secretKey: "key"
      - objectName: "jwt-secret"
        secretPath: "secret/data/gistpin/auth"
        secretKey: "jwt-secret"
  secretObjects:
    - secretName: gistpin-db-credentials
      type: Opaque
      data:
        - objectName: "db-password"
          key: "password"
    - secretName: gistpin-api-credentials
      type: Opaque
      data:
        - objectName: "api-key"
          key: "key"
