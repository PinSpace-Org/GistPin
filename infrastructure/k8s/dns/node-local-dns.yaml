apiVersion: v1
kind: ConfigMap
metadata:
  name: node-local-dns
  namespace: kube-system
data:
  Corefile: |
    cluster.local:53 {
        errors
        cache {
            success 9984 30
            denial 9984 5
        }
        reload
        loop
        bind 169.254.20.10
        forward . __PILLAR__CLUSTER__DNS__ {
            prefer_udp
        }
        prometheus :9253
        health
    }
    in-addr.arpa:53 {
        cache 30
        reload
        forward . __PILLAR__CLUSTER__DNS__
    }
    ip6.arpa:53 {
        cache 30
        reload
        forward . __PILLAR__CLUSTER__DNS__
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-local-dns
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: node-local-dns
  template:
    metadata:
      labels:
        app: node-local-dns
    spec:
      priorityClassName: system-node-critical
      hostNetwork: true
      dnsPolicy: Default
      tolerations:
        - operator: Exists
      containers:
        - name: node-cache
          image: registry.k8s.io/dns/k8s-dns-node-cache:1.23
          args:
            - "-localip"
            - "169.254.20.10"
            - "-conf"
            - "/etc/Corefile"
          ports:
            - containerPort: 53
              name: dns
              protocol: UDP
            - containerPort: 9253
              name: metrics
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/coredns
              name: config-volume
      volumes:
        - name: config-volume
          configMap:
            name: node-local-dns
---
apiVersion: v1
kind: Service
metadata:
  name: kube-dns-upstream
  namespace: kube-system
  annotations:
    prometheus.io/port: "9253"
    prometheus.io/scrape: "true"
spec:
  selector:
    app: node-local-dns
  ports:
    - name: dns
      port: 53
      protocol: UDP
    - name: metrics
      port: 9253
      protocol: TCP
