# ──────────────────────────────────────────────────────────────────────────────
# GistPin — ClusterSPIFFEID for Workload Registration
#
# Defines the SPIFFE ID CRD (spiffeid.spiffe.io/v1beta1) and a set of
# ClusterSPIFFEID entries that auto-register workloads into the trust domain.
# The SPIRE controller manager watches these and reconciles registration entries
# with the SPIRE server.
#
# Depends on: spire-server (server.yaml), spire-agent (agent-daemonset.yaml).
# ──────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-controller-manager
  namespace: spire
  labels:
    app: spire-controller-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-controller-manager
rules:
  - apiGroups: ["spiffeid.spiffe.io"]
    resources: ["clusterspiffeids"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["spiffeid.spiffe.io"]
    resources: ["clusterspiffeids/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces", "pods", "serviceaccounts", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-controller-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spire-controller-manager
subjects:
  - kind: ServiceAccount
    name: spire-controller-manager
    namespace: spire
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spire-controller-manager
  namespace: spire
  labels:
    app: spire-controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spire-controller-manager
  template:
    metadata:
      labels:
        app: spire-controller-manager
    spec:
      serviceAccountName: spire-controller-manager
      containers:
        - name: controller-manager
          image: ghcr.io/spiffe/spire-controller-manager:0.10.0
          args:
            - -config
            - /run/spire/config/controller-manager.conf
          volumeMounts:
            - name: spire-config
              mountPath: /run/spire/config
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            exec:
              command: ["/spire-controller-manager", "-version"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: spire-config
          configMap:
            name: spire-controller-manager-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-controller-manager-config
  namespace: spire
  labels:
    app: spire-controller-manager
data:
  controller-manager.conf: |
    log_level: "info"
    server_socket_path: "/run/spire/sockets/server.sock"
    cluster_dns: "10.96.0.10"
---
# CRD registration — required before any ClusterSPIFFEID can be created.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterspiffeids.spiffeid.spiffe.io
spec:
  group: spiffeid.spiffe.io
  names:
    kind: ClusterSPIFFEID
    listKind: ClusterSPIFFEIDList
    plural: clusterspiffeids
    singular: clusterspiffeid
  scope: Cluster
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                workloadSelectorTemplates:
                  type: array
                  items:
                    type: object
                  nullable: true
                dnsNameTemplates:
                  type: array
                  items:
                    type: string
                  nullable: true
                spiffeIDTemplate:
                  type: string
                  default: "spiffe://gistpin.local/ns/{{ .Pod.Namespace }}/sa/{{ .Pod.ServiceAccountName }}"
              required: ["spiffeIDTemplate"]
              nullable: true
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
---
# Register every workload in the gistpin namespace under a per-SA SPIFFE ID.
apiVersion: spiffeid.spiffe.io/v1beta1
kind: ClusterSPIFFEID
metadata:
  name: gistpin-workloads
spec:
  spiffeIDTemplate: "spiffe://gistpin.local/ns/{{ .Pod.Namespace }}/sa/{{ .Pod.ServiceAccountName }}"
  workloadSelectorTemplates:
    - "k8s:ns:gistpin"
    - "k8s:sa:backend"
    - "k8s:sa:frontend"
---
# Dedicated registration entry for database workloads (pinned, no auto-upgrade).
apiVersion: spiffeid.spiffe.io/v1beta1
kind: ClusterSPIFFEID
metadata:
  name: gistpin-databases
spec:
  spiffeIDTemplate: "spiffe://gistpin.local/db/{{ .Pod.Namespace }}/{{ .Pod.Name }}"
  workloadSelectorTemplates:
    - "k8s:ns:gistpin"
    - "k8s:sa:postgres"
