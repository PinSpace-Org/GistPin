apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-with-init
  namespace: gistpin
  labels:
    app: gistpin-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gistpin-backend
  template:
    metadata:
      labels:
        app: gistpin-backend
    spec:
      initContainers:
        # 1. Wait for PostgreSQL to accept connections
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL at ${DB_HOST}:${DB_PORT}..."
              ATTEMPTS=0
              until nc -z "${DB_HOST:-postgres-service}" "${DB_PORT:-5432}"; do
                ATTEMPTS=$((ATTEMPTS + 1))
                if [ "${ATTEMPTS}" -ge 30 ]; then
                  echo "ERROR: PostgreSQL not ready after 30 attempts. Aborting."
                  exit 1
                fi
                echo "  attempt ${ATTEMPTS}/30 — retrying in 5s..."
                sleep 5
              done
              echo "PostgreSQL is ready."
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_PORT
                  optional: true

        # 2. Wait for Soroban RPC endpoint
        - name: wait-for-soroban-rpc
          image: curlimages/curl:8.7.1
          command:
            - sh
            - -c
            - |
              RPC_URL="${SOROBAN_RPC_URL:-http://soroban-rpc:8000}"
              echo "Waiting for Soroban RPC at ${RPC_URL}..."
              ATTEMPTS=0
              until curl -sf "${RPC_URL}/health" -o /dev/null; do
                ATTEMPTS=$((ATTEMPTS + 1))
                if [ "${ATTEMPTS}" -ge 20 ]; then
                  echo "ERROR: Soroban RPC not ready after 20 attempts."
                  exit 1
                fi
                echo "  attempt ${ATTEMPTS}/20 — retrying in 5s..."
                sleep 5
              done
              echo "Soroban RPC is ready."
          env:
            - name: SOROBAN_RPC_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SOROBAN_RPC_URL
                  optional: true

        # 3. Wait for IPFS gateway
        - name: wait-for-ipfs
          image: curlimages/curl:8.7.1
          command:
            - sh
            - -c
            - |
              IPFS_URL="${IPFS_GATEWAY_URL:-http://ipfs-gateway:8080}"
              echo "Waiting for IPFS gateway at ${IPFS_URL}..."
              ATTEMPTS=0
              until curl -sf "${IPFS_URL}/api/v0/version" -o /dev/null; do
                ATTEMPTS=$((ATTEMPTS + 1))
                if [ "${ATTEMPTS}" -ge 15 ]; then
                  echo "WARN: IPFS gateway not ready — continuing anyway (non-critical)."
                  exit 0
                fi
                sleep 5
              done
              echo "IPFS gateway is ready."
          env:
            - name: IPFS_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: IPFS_GATEWAY_URL
                  optional: true

      containers:
        - name: backend
          image: ghcr.io/pinspace-org/gistpin-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
