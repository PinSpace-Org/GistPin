apiVersion: v1
kind: ServiceAccount
metadata:
  name: pdb-controller
  namespace: gistpin
  labels:
    app: pdb-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pdb-controller
  labels:
    app: pdb-controller
rules:
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pdb-controller
  labels:
    app: pdb-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pdb-controller
subjects:
  - kind: ServiceAccount
    name: pdb-controller
    namespace: gistpin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdb-controller
  namespace: gistpin
  labels:
    app: pdb-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdb-controller
  template:
    metadata:
      labels:
        app: pdb-controller
    spec:
      serviceAccountName: pdb-controller
      containers:
        - name: controller
          image: bitnami/kubectl:1.29
          command:
            - /bin/sh
            - -c
            - |
              echo "PDB Controller started"
              while true; do
                echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Checking PDB compliance..."

                for deployment in $(kubectl get deployments -n gistpin -o jsonpath='{.items[*].metadata.name}'); do
                  replicas=$(kubectl get deployment "$deployment" -n gistpin -o jsonpath='{.spec.replicas}')
                  pdb_exists=$(kubectl get pdb "${deployment}-pdb" -n gistpin --no-headers 2>/dev/null && echo "true" || echo "false")

                  if [[ "$replicas" -le 1 ]]; then
                    continue
                  fi

                  if [[ "$pdb_exists" == "false" ]]; then
                    echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] WARN: No PDB for ${deployment} (${replicas} replicas)"
                  fi
                done

                sleep 300
              done
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
