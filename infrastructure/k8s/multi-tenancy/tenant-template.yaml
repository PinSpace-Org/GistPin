# GistPin multi-tenancy – tenant provisioning template
#
# Renders one fully-isolated tenant stack on the shared cluster. Every object
# is labelled app.kubernetes.io/part-of=gistpin and tenant=<name> so policies
# (Kyverno), quotas and cost reporting can select tenants uniformly.
#
# Isolation layers provided per tenant:
#   1. Namespace          – API/object isolation boundary
#   2. ResourceQuota      – hard ceiling on compute/storage/API objects
#   3. LimitRange         – sane per-container defaults & bounds
#   4. NetworkPolicies    – default-deny east-west traffic; DNS egress only;
#                           cross-tenant traffic blocked by label selector
#   5. RBAC               – namespace-scoped Role bound to a dedicated SA
#
# Placeholders (replaced by infrastructure/scripts/onboard-tenant.sh):
#   ${TENANT_NAME}  – kebab-case tenant identifier
#   ${TENANT_TIER}  – small | medium | large (quota tier)
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-${TENANT_NAME}
  labels:
    app.kubernetes.io/part-of: gistpin
    app.kubernetes.io/managed-by: tenant-onboarding
    gistpin.io/tenant: ${TENANT_NAME}
    gistpin.io/tier: ${TENANT_TIER}
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: tenant-${TENANT_NAME}
  labels:
    gistpin.io/tenant: ${TENANT_NAME}
spec:
  hard:
    # Tier-based compute ceilings (small by default)
    requests.cpu: "${QUOTA_REQUESTS_CPU}"
    requests.memory: "${QUOTA_REQUESTS_MEMORY}"
    limits.cpu: "${QUOTA_LIMITS_CPU}"
    limits.memory: "${QUOTA_LIMITS_MEMORY}"
    persistentvolumeclaims: "${QUOTA_PVCS}"
    services.loadbalancers: "1"
    services.nodeports: "0"
    pods: "${QUOTA_PODS}"
    count/deployments.apps: "10"
    count/jobs.batch: "20"
    count/cronjobs.batch: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-defaults
  namespace: tenant-${TENANT_NAME}
  labels:
    gistpin.io/tenant: ${TENANT_NAME}
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "2"
        memory: 2Gi
---
# Default deny all ingress + egress inside the tenant namespace.
# Everything must be explicitly allowed below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: tenant-${TENANT_NAME}
  labels:
    gistpin.io/tenant: ${TENANT_NAME}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# Allow intra-tenant traffic only (pods within this namespace)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-tenant
  namespace: tenant-${TENANT_NAME}
  labels:
    gistpin.io/tenant: ${TENANT_NAME}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
# Permit DNS egress to kube-system (CoreDNS) only for UDP/TCP 53
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: tenant-${TENANT_NAME}
  labels:
    gistpin.io/tenant: ${TENANT_NAME}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Dedicated service account – workloads never run as `default`
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${TENANT_NAME}-workload
  namespace: tenant-${TENANT_NAME}
  labels:
    gistpin.io/tenant: ${TENANT_NAME}
automountServiceAccountToken: false
---
# Namespace-scoped role: full control of workload objects, zero cluster scope
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${TENANT_NAME}-workload-admin
  namespace: tenant-${TENANT_NAME}
  labels:
    gistpin.io/tenant: ${TENANT_NAME}
rules:
  - apiGroups: ["", "apps", "batch"]
    resources:
      - pods
      - pods/log
      - services
      - configmaps
      - secrets
      - persistentvolumeclaims
      - deployments
      - replicasets
      - statefulsets
      - jobs
      - cronjobs
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${TENANT_NAME}-workload-admin-binding
  namespace: tenant-${TENANT_NAME}
  labels:
    gistpin.io/tenant: ${TENANT_NAME}
subjects:
  - kind: ServiceAccount
    name: ${TENANT_NAME}-workload
    namespace: tenant-${TENANT_NAME}
roleRef:
  kind: Role
  name: ${TENANT_NAME}-workload-admin
  apiGroup: rbac.authorization.k8s.io
