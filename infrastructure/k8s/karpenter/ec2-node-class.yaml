apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
  annotations:
    kubernetes.io/description: "Default EC2 node class for Karpenter"
spec:
  role: KarpenterNodeRole-${ENVIRONMENT}
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "gistpin-${ENVIRONMENT}"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "gistpin-${ENVIRONMENT}"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        encrypted: true
        kmsKeyId: alias/gistpin-${ENVIRONMENT}-ebs
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  tags:
    Environment: "${ENVIRONMENT}"
    Project: gistpin
    ManagedBy: karpenter
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
  instanceProfile: KarpenterNodeRole-${ENVIRONMENT}
