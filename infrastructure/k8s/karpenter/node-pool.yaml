apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: default
  annotations:
    kubernetes.io/description: "Default node pool for general workloads"
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64", "arm64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r", "t"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["small", "medium", "large", "xlarge"]
      nodeClassRef:
        name: default
  limits:
    cpu: 100
    memory: 400Gi
  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 720h
  weight: 50
---
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: performance
  annotations:
    kubernetes.io/description: "High-performance node pool for compute-intensive workloads"
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "r", "z"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["3"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge", "2xlarge", "4xlarge"]
      nodeClassRef:
        name: default
      taints:
        - key: workload-type
          value: performance
          effect: NoSchedule
  limits:
    cpu: 40
    memory: 160Gi
  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 168h
  weight: 30
---
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: spot-batch
  annotations:
    kubernetes.io/description: "Spot-only pool for batch and tolerant workloads"
spec:
  template:
    metadata:
      labels:
        workload-type: batch
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["m", "c", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]
      nodeClassRef:
        name: default
      taints:
        - key: workload-type
          value: batch
          effect: NoSchedule
  limits:
    cpu: 60
    memory: 240Gi
  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 24h
  weight: 10
