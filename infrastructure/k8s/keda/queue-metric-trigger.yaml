###############################################################################
# KEDA TriggerAuthentication – SQS Queue Metrics
# Issue #1128: Kubernetes pod autoscaling based on queue depth (KEDA)
#
# This TriggerAuthentication grants KEDA the AWS credentials required to
# read SQS queue attributes (ApproximateNumberOfMessages) for scaling decisions.
#
# Recommended: use IAM Roles for Service Accounts (IRSA) on EKS so that no
# long-lived credentials are stored in the cluster.
###############################################################################
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: indexer-queue-auth
  namespace: gistpin
  labels:
    app: indexer
    component: autoscaling
    managed-by: keda
spec:
  podIdentity:
    # Use AWS IRSA (recommended for EKS)
    # Requires the KEDA operator's service account to be annotated with an IAM role
    # that has sqs:GetQueueAttributes and sqs:GetQueueUrl permissions.
    provider: aws

---
###############################################################################
# Fallback: Secret-based authentication (use only when IRSA is unavailable)
# Uncomment the block below and comment out the podIdentity block above.
###############################################################################
