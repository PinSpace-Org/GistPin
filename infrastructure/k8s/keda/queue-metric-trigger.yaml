# type: Opaque
# stringData:
#   AWS_ACCESS_KEY_ID: "<injected-by-sealed-secrets-or-external-secrets>"
#   AWS_SECRET_ACCESS_KEY: "<injected-by-sealed-secrets-or-external-secrets>"
# ---
