#   namespace: gistpin
# spec:
#   secretTargetRef:
#     - parameter: awsAccessKeyID
#       name: indexer-queue-credentials
#       key: AWS_ACCESS_KEY_ID
#     - parameter: awsSecretAccessKey
#       name: indexer-queue-credentials
#       key: AWS_SECRET_ACCESS_KEY

---
###############################################################################
# IAM Policy (apply via Terraform or aws CLI)
# Minimum permissions required for the KEDA operator role:
#
# {
#   "Version": "2012-10-17",
#   "Statement": [
#     {
#       "Effect": "Allow",
#       "Action": [
#         "sqs:GetQueueAttributes",
#         "sqs:GetQueueUrl"
#       ],
#       "Resource": "arn:aws:sqs:us-east-1:*:gistpin-indexer-queue"
#     }
#   ]
# }
###############################################################################
# ConfigMap: queue configuration consumed by the ScaledObject
apiVersion: v1
kind: ConfigMap
metadata:
  name: indexer-queue-config
  namespace: gistpin
  labels:
    app: indexer
    component: autoscaling
data:
  QUEUE_NAME: gistpin-indexer-queue
  AWS_REGION: us-east-1
  # Target messages-per-pod ratio (also set in ScaledObject)
  QUEUE_LENGTH_PER_POD: "10"
