apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gistpin
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/PinSpace-Org/GistPin
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gistpin-infra
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: gistpin
  path: ./infrastructure/k8s
  prune: true
